<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../../style.css" />
    <link rel="icon" href="../../multimedia/ikony/icon2.png" />
    <!-- blockly import -->
    <script src="https://unpkg.com/blockly/blockly.min.js"></script>
    <script src="https://unpkg.com/blockly/msg/en.js"></script>
    <!-- codemirror import -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.21/codemirror.min.css"
    />

    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.21/codemirror.min.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.21/mode/javascript/javascript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.21/mode/python/python.min.js"></script>
    <title>Editor</title>
  </head>
  <body>
    <nav>
      <div class="left">
        <a href="../../en/">
          <img
            src="../../multimedia/ikony/BlockLog.png"
            alt="Codinger logo"
            width="60"
            class="pic"
          />
        </a>

        <a href="../projects/pl/">Settings</a>

        <div class="dropdown">
          <a href="javascript:void(0);" class="dropdown-btn">File▼</a>
          <div class="menu left menuleft">
            <a href="javascript:void(0);" id="newProject">New</a>
            <hr class="small" />
            <a href="javascript:void(0);" id="loadLink">Load</a>
            <input
              type="file"
              id="loadProject"
              style="display: none"
              accept=".json"
            />
            <hr class="small" />
            <a href="javascript:void(0);" onclick="saveProject()">Save</a>
            <hr class="small" />
            <a href="javascript:void(0);" id="exportfile">Export</a>
          </div>
        </div>

        <a href="../tutorials/pl/">Debug</a>
        <a href="../editor/pl/">Tutorials</a>
      </div>

      <div class="middle">
        <a href="javascript:void(0);">Console</a>
        <div id="translatebox">
          <div class="dropdown middle">
            <a href="javascript:void(0);" class="dropdown-btn"
              ><img id="proglandis" class="pic" height="35" />▼</a
            >
            <div class="menu left menuleft">
              <a id="py" href="javascript:void(0);">Python</a>
              <hr class="small" />
              <a id="js" href="javascript:void(0);">JavaScript</a>
              <hr class="small" />
              <a id="blocks" href="javascript:void(0);">Blocks</a>
              <hr class="small" />
              <a href="javascript:void(0);">More...</a>
            </div>
          </div>
          <a id="reveBtn" href="javascript:void(0);">⇋</a>
          <div class="dropdown middle">
            <a href="javascript:void(0);" class="dropdown-btn"
              ><img id="proglandis2" class="pic" height="35" />▼</a
            >
            <div class="menu left menuleft">
              <a id="py2" href="javascript:void(0);">Python</a>
              <hr class="small" />
              <a id="js2" href="javascript:void(0);">JavaScript</a>
              <hr class="small" />
              <a id="blocks2" href="javascript:void(0);">Blocks</a>
              <hr class="small" />
              <a href="javascript:void(0);">More...</a>
            </div>
          </div>
        </div>
      </div>

      <div class="right">
        <div class="dropdown right">
          <a href="javascript:void(0);" class="dropdown-btn"
            ><img src="../../multimedia/flagi/en.png" class="pic" height="30" />
            ▼</a
          >
          <div class="menu left menuright">
            <a href="../en/">English</a>
            <hr class="small" />
            <a href="../pl/">Polish</a>
          </div>
        </div>
      </div>
    </nav>

    <!--CodeMirror-->
    <textarea id="codearea"></textarea>

    <!--Blockly-->

    <div id="blocklyDiv"></div>
    <xml id="toolbox" style="display: none">
      <category name="START">
        <block type="start"></block>
      </category>
      <category name="Basic">
        <block type="print"></block>
        <block type="get_var"></block>
        <block type="number"></block>
      </category>
      <!-- Text -->
      <category name="Text">
        <block type="text"></block>
        <block type="print"></block>
      </category>

      <!-- Numbers -->
      <category name="Numbers">
        <block type="number"></block>
        <block type="add"></block>
        <block type="subtract"></block>
        <block type="multiply"></block>
      </category>

      <!-- Variables -->
      <category name="Variables" custom="VARIABLE">
        <block type="get_var"></block>
        <block type="set_var"></block>
      </category>

      <!-- Logic -->
      <category name="Logic">
        <block type="boolean"></block>
        <block type="equals"></block>
      </category>

      <!-- Control -->
      <category name="Control">
        <block type="if"></block>
        <block type="while"></block>
      </category>
    </xml>
    <script src="../blocks.js"></script>

    <script src="../../script.js"></script>
    <script src="../system.js"></script>
  </body>
</html>
