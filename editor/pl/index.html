    <!--Blockly-->

    <div id="blocklyDiv" style="height: 590px; width: 100%"></div>
    <xml id="toolbox" style="display: none">
      <category name="START">
        <block type="start"></block>
      </category>
      <category name="Podstawowe">
        <block type="print"></block>
        <block type="get_var"></block>
        <block type="number"></block>
      </category>
      <!-- Tekst -->
      <category name="Tekst">
        <block type="text"></block>
        <block type="print"></block>
      </category>

      <!-- Liczby -->
      <category name="Liczby">
        <block type="number"></block>
        <block type="add"></block>
        <block type="subtract"></block>
        <block type="multiply"></block>
      </category>

      <!-- Zmienne -->
      <category name="Zmienne" custom="VARIABLE">
        <block type="get_var"></block>
        <block type="set_var"></block>
      </category>

      <!-- Logika -->
      <category name="Logika">
        <block type="boolean"></block>
        <block type="equals"></block>
      </category>

      <!-- Sterowanie -->
      <category name="Sterowanie">
        <block type="if"></block>
        <block type="while"></block>
      </category>
    </xml>
    <script src="../blocks.js"></script>

    <script src="../../script.js"></script>
